<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>__MSG_blockedTitleDefault__</title>
  </head>
  <body>
    <main class="block-card">
      <div class="icon">🚫</div>
      <h1 id="title"></h1>
      <p id="message"></p>
      <div id="site" class="site"></div>
      <div id="countdown" class="countdown hidden"></div>
      <div id="auto-close" class="auto-close hidden"></div>
      <div id="actions" class="actions">
        <button id="btn-continue" class="btn btn-primary hidden">__MSG_blockedContinue__</button>
        <div id="timer-row" class="timer-row">
          <input id="timer-min" type="number" min="1" max="1440" value="30" class="timer-input" />
          <span class="timer-unit">__MSG_blMin__</span>
          <button id="btn-timer" class="btn btn-ghost">__MSG_blockedTimer__</button>
        </div>
        <button id="btn-unlock" class="btn btn-secondary">__MSG_blockedUnlock__</button>
      </div>
      <footer><a id="link-options" href="#">__MSG_blockedOpenSettings__</a></footer>
    </main>

    <div id="modal" class="modal hidden">
      <div class="modal-box">
        <h2>__MSG_blockedModalTitle__</h2>
        <p id="pwd-hint" class="hint"></p>
        <div id="pwd-wrap">
          <input id="pwd-input" type="password" placeholder="__MSG_blockedPwdPlaceholder__" autocomplete="off" />
          <a id="btn-forget" href="#">__MSG_blockedForget__</a>
        </div>
        <div id="sec-wrap" class="hidden">
          <p id="sec-question" class="hint"></p>
          <input id="sec-input" type="text" placeholder="__MSG_blockedSecPlaceholder__" autocomplete="off" />
        </div>
        <p id="pwd-error" class="error hidden"></p>
        <div class="modal-actions">
          <button id="btn-pwd-cancel" class="btn btn-ghost">__MSG_cancel__</button>
          <button id="btn-pwd-ok" class="btn btn-primary">__MSG_confirm__</button>
        </div>
        <div id="unlock-options" class="unlock-options hidden">
          <div class="session-row">
            <select id="session-min" class="session-select">
              <option value="1">1 __MSG_blMin__</option>
              <option value="5" selected>5 __MSG_blMin__</option>
              <option value="10">10 __MSG_blMin__</option>
              <option value="15">15 __MSG_blMin__</option>
              <option value="30">30 __MSG_blMin__</option>
            </select>
            <button id="btn-session" class="btn btn-primary">__MSG_blockedSession__</button>
          </div>
          <button id="btn-remove" class="btn btn-danger">__MSG_blockedRemove__</button>
        </div>
        <div id="new-pwd-box" class="new-pwd hidden">
          <p class="hint">__MSG_blockedNewPwd__</p>
          <code id="new-pwd-value"></code>
        </div>
      </div>
    </div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
