<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>网站被拦截</title>
  </head>
  <body>
    <main class="block-card">
      <div class="icon">🚫</div>
      <h1 id="title"></h1>
      <p id="message"></p>
      <div id="site" class="site"></div>
      <div id="countdown" class="countdown hidden"></div>
      <div id="actions" class="actions">
        <button id="btn-continue" class="btn btn-primary hidden">继续访问</button>
        <button id="btn-unlock" class="btn btn-ghost">需要提前访问</button>
      </div>
      <footer>
        <a id="link-options" href="#">打开设置</a>
      </footer>
    </main>

    <div id="modal" class="modal hidden">
      <div class="modal-box">
        <h2>解锁或修改拦截</h2>
        <p id="pwd-hint" class="hint"></p>
        <input id="pwd-input" type="password" placeholder="输入随机密码" autocomplete="off" />
        <p id="pwd-error" class="error hidden">密码错误，请重试</p>
        <div class="modal-actions">
          <button id="btn-pwd-cancel" class="btn btn-ghost">取消</button>
          <button id="btn-pwd-ok" class="btn btn-primary">确认</button>
        </div>
        <div id="unlock-options" class="unlock-options hidden">
          <div class="session-row">
            <select id="session-min" class="session-select">
              <option value="1">1 分钟</option>
              <option value="5" selected>5 分钟</option>
              <option value="10">10 分钟</option>
              <option value="15">15 分钟</option>
              <option value="30">30 分钟</option>
            </select>
            <button id="btn-session" class="btn btn-primary">临时访问</button>
          </div>
          <button id="btn-remove" class="btn btn-danger">从拦截列表移除</button>
        </div>
      </div>
    </div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
