<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/icon/128.png" />
    <title>__MSG_appName__</title>
  </head>
  <body>
    <header class="header">
      <div class="brand"><img src="logo.svg" class="logo-icon" alt="" /><span class="brand-name">__MSG_popupBrand__</span></div>
      <div class="header-right">
        <button id="btn-theme" class="icon-btn" title="__MSG_popupThemeToggle__">🌙</button>
        <label class="switch"><input id="lock-toggle" type="checkbox" /><span class="slider"></span></label>
      </div>
    </header>

    <section class="current">
      <div id="current-host" class="host">__MSG_popupUnknownSite__</div>
      <div class="row">
        <select id="block-type" class="select">
          <option value="permanent">__MSG_popupTypePermanent__</option>
          <option value="timewise">__MSG_popupTypeTimewise__</option>
          <option value="attemptwise">__MSG_popupTypeAttemptwise__</option>
        </select>
        <button id="btn-block" class="btn btn-primary">__MSG_popupBlockThis__</button>
      </div>
      <button id="btn-unblock" class="btn btn-danger hidden">__MSG_popupUnblock__</button>
      <div class="row wlrow">
        <button id="btn-whitelist" class="btn btn-secondary">__MSG_popupWhitelist__</button>
        <label class="wl-mode" title="__MSG_behaviorWlMode__">
          <input id="wl-mode-toggle" type="checkbox" /> __MSG_popupWlMode__
        </label>
      </div>
      <div class="row" style="margin-top:8px;">
        <button id="btn-pause" class="btn btn-ghost">__MSG_popupPause__</button>
      </div>
    </section>

    <section class="pomodoro">
      <div class="pomo-head">
        <span id="pomo-status">__MSG_popupPomodoro__</span>
        <span id="pomo-time" class="pomo-time">25:00</span>
        <div class="pomo-btns">
          <button id="pomo-start" class="btn btn-small btn-primary">__MSG_pomodoroStart__</button>
          <button id="pomo-pause" class="btn btn-small hidden">__MSG_pomodoroPause__</button>
          <button id="pomo-resume" class="btn btn-small hidden">__MSG_pomodoroResume__</button>
          <button id="pomo-stop" class="btn btn-small hidden">__MSG_pomodoroStop__</button>
        </div>
      </div>
    </section>

    <section class="list-section">
      <h3 id="block-heading"></h3><span id="block-count" class="hidden">0</span>
      <ul id="block-list" class="list"></ul>
    </section>

    <footer><a id="link-options" href="#">__MSG_popupSettings__</a></footer>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
